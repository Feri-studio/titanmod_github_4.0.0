<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход · TitanMod</title>
  <link rel="stylesheet" href="/static/panel.css">
</head>
<body>
<div class="login-page">
  <div class="box login">
    <h1>{{ bot }}</h1>
    <p class="muted">Admin Panel · v{{ ver }}</p>
    {% if error %}<p class="err">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <label>Пароль панели</label>
      <input type="password" name="password" autofocus required placeholder="PANEL_PASSWORD">
      <button type="submit" style="width:100%;margin-top:16px;justify-content:center">Войти</button>
    </form>
    <p class="hint">Пароль из <code>PANEL_PASSWORD</code> в .env<br>или код активации бота.</p>
  </div>
</div>
</body>
</html>
