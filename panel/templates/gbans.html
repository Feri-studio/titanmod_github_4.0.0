{% extends "base.html" %}
{% block title %}Gban{% endblock %}
{% block content %}
<h1>Глобальные баны</h1>
<form method="post" action="/gbans/add" class="row">
  <input name="user_id" type="number" required placeholder="user_id">
  <input name="reason" placeholder="reason" value="panel">
  <button type="submit">Добавить gban</button>
</form>
<table>
  <tr><th>user_id</th><th>username</th><th>name</th><th>reason</th><th></th></tr>
  {% for r in rows %}
  <tr>
    <td><code>{{ r.user_id }}</code></td>
    <td>{{ r.username or '' }}</td>
    <td>{{ r.first_name or '' }}</td>
    <td>{{ r.gban_reason or r.reason or '' }}</td>
    <td>
      <form method="post" action="/gbans/{{ r.user_id }}/remove" class="inline">
        <button type="submit" class="danger">Снять</button>
      </form>
    </td>
  </tr>
  {% else %}
  <tr><td colspan="5">Пусто</td></tr>
  {% endfor %}
</table>
{% endblock %}
